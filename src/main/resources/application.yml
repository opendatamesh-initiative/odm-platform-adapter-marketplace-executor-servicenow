quarkus:
  application:
    name: odm-platform-adapter-marketplace-executor-servicenow
  http:
    port: 9019
  log:
    console:
      format: "%d{yyyy-MM-dd HH:mm:ss} [%t] %-5p %c{3.} - %s%e%n"
  qute:
    strict-rendering: false
    property-not-found-strategy: noop
  smallrye-openapi:
    path: /api-docs
    info-title: ODM Platform Adapter Marketplace Executor ServiceNow API
    info-description: API for fulfilling marketplace subscription and unsubscription requests through ServiceNow tickets, and for receiving ServiceNow ticket events
    info-version: v1.0.0
    info-license-name: Apache 2.0
    info-license-url: http://www.apache.org/licenses/LICENSE-2.0.html
  swagger-ui:
    always-include: true
    path: /swagger-ui
    operations-sorter: method
    tags-sorter: alpha

# ODM configuration
odm:
  product-plane:
    marketplace-service:
      active: true
      address: http://localhost:8085
      result-delivery:
        max-attempts: 5
        backoff: 1s

# ServiceNow configuration
servicenow:
  instance-url: ${SERVICENOW_INSTANCE_URL}
  auth:
    type: OAUTH2_CLIENT_CREDENTIALS
    oauth2:
      client-id: ${SERVICENOW_CLIENT_ID:}
      client-secret: ${SERVICENOW_CLIENT_SECRET:}
    api-key:
      value: ${SERVICENOW_API_KEY:}
  # Ticket profiles (servicenow.profiles.subscribe / .unsubscribe) are intentionally NOT defined here:
  # Quarkus merges lists/maps across config sources, so packaged defaults would leak into your rules.
  # Provide them entirely in an external config/application.yml (see README "Basic scenarios").
  messages:
    pending: "ServiceNow ticket {ticket.number} opened for {operation} of {request.provider.dataProductFqn} (ports: {#each request.provider.dataProductPortsFqn}{it}{#if it_hasNext}, {/if}{/each}). Awaiting fulfilment: {ticket.link}"
    fulfilled: "{outcome.status} through ServiceNow ticket {ticket.number} ({ticket.link}){#if ticket.closedBy} closed by {ticket.closedBy}{/if}.{#if fields.close_notes} Close notes: {fields.close_notes}{/if}"
    refused: "Request refused on ServiceNow: ticket {ticket.number} ({ticket.link}){#if ticket.closedBy} closed by {ticket.closedBy}{/if}.{#if fields.close_notes} Reason: {fields.close_notes}{/if}"
    failed: "ServiceNow reported a failure on ticket {fields.number} ({ticket.link}).{#if fields.close_notes} Details: {fields.close_notes}{/if}"
    technical-error: "Technical error while processing {operation} on ServiceNow: {error.message}"
    closing-user:
      include: ${SERVICENOW_MESSAGES_INCLUDE_CLOSING_USER:true}
      field: closed_by
